plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neo_version

    // Generate a runtime-usable mods.toml substitution set from gradle.properties.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    // JEI (Just Enough Items) — recipe viewer integration.
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    // Compile against the JEI API; load the full JEI mod at dev runtime for testing.
    compileOnly "mezz.jei:jei-${jei_mc}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mc}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_mc}-neoforge:${jei_version}"
}

// Expand gradle.properties values into resource files (neoforge.mods.toml, pack.mcmeta).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
