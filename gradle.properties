# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
# Gradle 8.10.2 cannot compile build scripts on JDK 25; run its launcher on JDK 21.
# The mod source still compiles with the Java 25 toolchain (see build.gradle).
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot

# Mod
mod_id=arrow_fletching
